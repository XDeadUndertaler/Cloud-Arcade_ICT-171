<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe | CloudArcade</title>
  <link rel="stylesheet" href="../css/tic_tac_toe.css" />
</head>
<body>
    <!-- Floating background shapes -->
    <div class="background-shapes" id="floatingShapes"></div>
  <div class="container">
    <h1>🎮 Tic Tac Toe 🎮</h1>

    <!-- Player Setup -->
    <div id="player-setup">
      <input type="text" id="player1" placeholder="Enter Player 1 Name" required>
      <input type="text" id="player2" placeholder="Enter Player 2 Name (or leave blank for Computer)">
      <button id="startBtn">Start Game</button>
    </div>

    <!-- Game Area -->
    <div id="game-area" style="display: none;">
      <p class="turn-text">Player 1's Turn</p>

      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>

      <button id="resetBtn">Restart Game</button>
      <div class="result" id="result"></div>
      <a href="../index.html" class="back-btn">⬅ Back to Home</a>
    </div>
  </div>

  <script src="../js/tic_tac_toe.js"></script>
</body>
</html>
